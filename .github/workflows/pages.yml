# Publishes site/ (privacy policy, terms, support page) to GitHub Pages:
#   https://jheanm-gh.github.io/Toll-E/
# Runs only when started by hand (Actions → Publish site → Run workflow), never on push.
# One-time set-up: Settings → Pages → Source: "GitHub Actions". See docs/release/legal-pages.md.
name: Publish site

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Refuse to publish unfilled placeholders
        run: |
          if grep -n '{{[A-Z_]*}}' site/*.html; then
            echo "::error::Replace the {{...}} placeholders in site/ before publishing (docs/release/legal-pages.md)."
            exit 1
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
